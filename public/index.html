<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ely • CEPMG</title>
<style>
:root{--bg:#f3f8ec;--bg2:#e6f1d6;--card:rgba(255,255,255,.55);--bd:rgba(255,255,255,.9);--tx:#0c2412;--mu:#5d7260;--g1:#16a34a;--g2:#0d7a37;--y:#facc15;--sh:#c9dbb5;--sh2:#fff}
[data-theme=dark]{--bg:#0d1a10;--bg2:#12251a;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--tx:#f1f8e9;--mu:#9bb39e;--sh:#07100a;--sh2:#1a2e20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg),var(--bg2));overflow-x:hidden}
.blob{position:fixed;border-radius:50%;pointer-events:none;background:linear-gradient(135deg,rgba(250,204,21,.35),rgba(22,163,74,.25));border:2px solid var(--bd)}
.b1{width:300px;height:300px;top:-130px;left:-110px}.b2{width:120px;height:120px;right:-50px;top:26%}.b3{width:340px;height:340px;right:-140px;bottom:-130px}.b4{width:200px;height:200px;left:-90px;bottom:-60px}
#login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));position:relative}
.wrap{width:100%;max-width:400px;text-align:center;position:relative;z-index:1}
.theme{position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;z-index:5;width:46px;height:46px;border-radius:16px}
.neo{background:var(--card);border:1.5px solid var(--bd);box-shadow:6px 6px 16px var(--sh),-6px -6px 16px var(--sh2);backdrop-filter:blur(10px);color:var(--tx);cursor:pointer}
.logo{width:120px;height:120px;border-radius:36px;margin:0 auto 22px;display:grid;place-items:center;cursor:default}
h1{font-size:34px;margin:0 0 6px;font-weight:800;letter-spacing:-.5px}
.sub{letter-spacing:.3em;font-size:13px;color:var(--mu);margin:0 0 26px}
.field{display:flex;align-items:center;gap:14px;border-radius:22px;padding:0 18px;height:58px;margin-bottom:14px;box-shadow:inset 3px 3px 8px var(--sh),inset -3px -3px 8px var(--sh2);background:var(--card);border:1.5px solid var(--bd)}
.field svg{flex:none;color:var(--mu)}.field input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16px;color:var(--tx)}
.field input::placeholder{color:var(--mu)}.field:focus-within{border-color:var(--g1)}
.eye{background:none;border:0;padding:4px;cursor:pointer;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:4px 2px 18px}
.row label{display:flex;align-items:center;gap:10px;cursor:pointer}
.row input{appearance:none;width:26px;height:26px;border-radius:8px;background:var(--card);border:1.5px solid var(--bd);display:grid;place-items:center;margin:0;box-shadow:2px 2px 6px var(--sh)}
.row input:checked{background:var(--g1);border-color:var(--g1)}.row input:checked::after{content:"✓";color:#fff;font-weight:700}
a.lnk{color:var(--g2);font-weight:600;text-decoration:none;cursor:pointer}
.btn{width:100%;height:60px;border:0;border-radius:30px;color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;background:linear-gradient(100deg,#15a34a,#0d7a37 60%,#a3a31a);box-shadow:0 10px 28px rgba(22,163,74,.4);transition:transform .1s}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.7}
.btn .ar{position:absolute;right:8px;width:44px;height:44px;border-radius:50%;background:rgba(250,204,21,.9);color:#0c2412;display:grid;place-items:center}
.or{display:flex;align-items:center;gap:12px;margin:26px 0 18px;font-size:12px;letter-spacing:.25em;color:var(--mu)}.or::before,.or::after{content:"";flex:1;height:1.5px;background:var(--g1);opacity:.5}
.soc{display:flex;justify-content:center;gap:18px}.soc button{width:68px;height:68px;border-radius:22px;display:grid;place-items:center}
.tag{margin-top:26px;font-size:11px;letter-spacing:.3em;color:var(--mu)}
.err{color:#c62828;font-size:14px;min-height:20px;margin:0 0 10px}
.more{position:fixed;right:22px;bottom:22px;text-align:left;font-size:10px;letter-spacing:.25em;color:var(--mu);line-height:1.6;z-index:1}.more::after{content:"";display:block;width:24px;height:2px;background:var(--g1);margin-top:6px}
/* chat */
#app{display:none;height:100%;flex-direction:column;position:relative;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 16px 12px}
header .mini{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
header b{font-size:18px;display:block}header small{color:var(--mu)}header .sp{flex:1}
header button{border-radius:14px;height:42px;padding:0 14px;font-size:14px}
#msgs{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.m{max-width:85%;padding:12px 16px;border-radius:20px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
.m.u{align-self:flex-end;background:linear-gradient(100deg,#15a34a,#0d7a37);color:#fff;border-bottom-right-radius:6px}
.m.a{align-self:flex-start;border-bottom-left-radius:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.chips button{border-radius:16px;padding:9px 14px;font-size:13.5px}
form.in{display:flex;gap:10px;padding:10px 16px max(14px,env(safe-area-inset-bottom));position:relative;z-index:1}
form.in .field{flex:1;margin:0;height:54px}
#send{width:54px;height:54px;border-radius:50%;border:0;background:var(--y);color:#0c2412;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 16px rgba(250,204,21,.45)}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--g1);animation:d 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes d{50%{transform:translateY(-5px);opacity:.4}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<button class="neo theme" id="theme" aria-label="Alternar tema">🌙</button>

<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#0d6b30"/></linearGradient>
<linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#eab308"/></linearGradient>
<symbol id="flame" viewBox="0 0 100 100"><path d="M30 55C18 62 22 84 38 92 30 78 38 66 52 58 44 54 36 52 30 55Z" fill="url(#lg1)"/><path d="M42 40C28 54 44 64 58 80 52 66 62 56 74 46 64 46 50 40 42 40Z" fill="url(#lg1)" opacity=".9"/><path d="M56 12C46 22 56 34 70 44 74 36 80 28 56 12Z" fill="url(#lg2)"/></symbol>
</defs></svg>

<main id="login">
 <div class="wrap">
  <div class="neo logo"><svg width="76" height="76"><use href="#flame"/></svg></div>
  <h1 id="ttl">Bem-vindo de volta</h1>
  <p class="sub" id="sub">Entre para continuar</p>
  <form id="lf" autocomplete="on">
   <div class="field" id="fname" hidden><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/><circle cx="12" cy="7" r="4"/></svg><input id="name" placeholder="Nome completo"></div>
   <div class="field" id="femail" hidden><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg><input id="email" type="email" placeholder="E-mail"></div>
   <div class="field"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/><circle cx="12" cy="7" r="4"/></svg><input id="user" placeholder="Usuário ou E-mail" autocomplete="username" required></div>
   <div class="field"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="pass" type="password" placeholder="Senha" autocomplete="current-password" required><button type="button" class="eye" id="eye" aria-label="Mostrar senha"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
   <div class="row"><label><input type="checkbox" id="rem" checked>Lembrar de mim</label><a class="lnk" id="forgot">Esqueceu a senha?</a></div>
   <p class="err" id="err"></p>
   <button class="btn" id="go"><span id="gotxt">Entrar</span><span class="ar"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></button>
  </form>
  <p style="font-size:14px;margin:18px 0 0;color:var(--mu)"><span id="swq">Primeiro acesso?</span> <a class="lnk" id="sw">Criar conta</a></p>
  <div class="or">OU CONTINUE COM</div>
  <div class="soc">
   <button class="neo" data-s="Google" aria-label="Google"><svg width="30" height="30" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.400c-.5 2.900-2.200 5.300-4.600 6.900l7.400 5.700c4.400-4 6.900-10 6.900-17.100z"/><path fill="#FBBC05" d="M10.400 28.800A14.500 14.500 0 0 1 9.500 24c0-1.700.3-3.300.9-4.800l-7.800-6A24 24 0 0 0 0 24c0 3.900.9 7.500 2.600 10.800l7.800-6z"/><path fill="#34A853" d="M24 48c6.200 0 11.400-2 15.200-5.600l-7.400-5.700c-2 1.400-4.700 2.200-7.800 2.200-6.300 0-11.600-4.100-13.600-9.800l-7.800 6C6.500 42.600 14.600 48 24 48z"/></svg></button>
   <button class="neo" data-s="Discord" aria-label="Discord"><svg width="32" height="32" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.300 4.400A19 19 0 0 0 15.600 3l-.2.400a17 17 0 0 1 4 1.900 15.600 15.600 0 0 0-14.800 0 17 17 0 0 1 4-1.900L8.400 3a19 19 0 0 0-4.700 1.400C.7 8.900-.1 13.300.3 17.600A19 19 0 0 0 6 20.500l1.200-2a12 12 0 0 1-1.900-.9l.5-.4a13.600 13.600 0 0 0 12.400 0l.5.400c-.6.400-1.200.7-1.900.9l1.200 2a19 19 0 0 0 5.700-2.900c.5-5-.8-9.400-3.400-13.200zM8.700 14.900c-1.100 0-2-1-2-2.200s.9-2.200 2-2.200 2 1 2 2.200-.9 2.200-2 2.200zm6.600 0c-1.100 0-2-1-2-2.200s.9-2.200 2-2.200 2 1 2 2.200-.9 2.200-2 2.200z"/></svg></button>
   <button class="neo" data-s="Facebook" aria-label="Facebook"><svg width="32" height="32" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path fill="#fff" d="M16.700 15.500l.5-3.500h-3.300V9.800c0-1 .5-1.900 2-1.900h1.500V4.900s-1.400-.2-2.700-.2c-2.700 0-4.500 1.700-4.500 4.700V12H7.200v3.500h3V24h3.700v-8.500z"/></svg></button>
  </div>
  <div class="tag">ESTUDE • PARTICIPE • CRESÇA JUNTOS</div>
 </div>
 <div class="more">MAIS<br>QUE UMA<br>ESCOLA</div>
</main>

<section id="app">
 <header><div class="neo mini"><svg width="30" height="30"><use href="#flame"/></svg></div><div><b>Ely</b><small>Assistente do CEPMG</small></div><span class="sp"></span><button class="neo" id="clear">Nova conversa</button><button class="neo" id="out">Sair</button></header>
 <div id="msgs"></div>
 <form class="in" id="cf"><div class="field"><input id="q" placeholder="Pergunte algo à Ely..." autocomplete="off"></div><button id="send" aria-label="Enviar"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></form>
</section>

<script>
const $=s=>document.querySelector(s);let mode='login',token=localStorage.ely_t||sessionStorage.ely_t||'',hist=[];
const root=document.documentElement;
function setTheme(t){root.dataset.theme=t;$('#theme').textContent=t==='dark'?'☀️':'🌙';try{localStorage.ely_theme=t}catch{}}
setTheme(localStorage.ely_theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#theme').onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark');
$('#eye').onclick=()=>{const p=$('#pass');p.type=p.type==='password'?'text':'password'};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>$('#err').textContent='Login com '+b.dataset.s+' ainda não está configurado.');
$('#forgot').onclick=()=>$('#err').textContent='Procure a secretaria da escola para redefinir sua senha.';
$('#sw').onclick=()=>{mode=mode==='login'?'reg':'login';const r=mode==='reg';
 $('#fname').hidden=$('#femail').hidden=!r;$('#ttl').textContent=r?'Criar conta':'Bem-vindo de volta';$('#sub').textContent=r?'Preencha seus dados':'Entre para continuar';
 $('#gotxt').textContent=r?'Cadastrar':'Entrar';$('#sw').textContent=r?'Entrar':'Criar conta';$('#swq').textContent=r?'Já tem conta?':'Primeiro acesso?';
 $('#user').placeholder=r?'Escolha um usuário':'Usuário ou E-mail';$('#err').textContent=''};
async function api(u,b,auth){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Erro'),{status:r.status});return j}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';$('#go').disabled=true;
 try{const r=mode==='login'?await api('/api/login',{user:$('#user').value,pass:$('#pass').value,remember:$('#rem').checked})
   :await api('/api/register',{name:$('#name').value,email:$('#email').value,user:$('#user').value,pass:$('#pass').value});
  token=r.token;delete localStorage.ely_t;delete sessionStorage.ely_t;($('#rem').checked?localStorage:sessionStorage).ely_t=token;localStorage.ely_n=r.name;openApp(r.name)}
 catch(x){$('#err').textContent=x.message}$('#go').disabled=false};
function add(t,c){const d=document.createElement('div');d.className='m '+c;if(c==='a')d.classList.add('neo');d.textContent=t;$('#msgs').append(d);$('#msgs').scrollTop=1e9;return d}
function welcome(n){hist=[];$('#msgs').innerHTML='';add(`Oi${n?', '+n.split(' ')[0]:''}! Eu sou a Ely 💚💛, a assistente do CEPMG. Posso tirar dúvidas sobre o regimento escolar e ajudar nos seus estudos.`,'a');
 const c=document.createElement('div');c.className='chips';['Quais são os deveres dos estudantes?','Como funciona o uso do uniforme?','Quais são as regras de frequência?'].forEach(t=>{const b=document.createElement('button');b.className='neo';b.textContent=t;b.onclick=()=>{$('#q').value=t;$('#cf').requestSubmit()};c.append(b)});$('#msgs').append(c)}
function openApp(n){$('#login').style.display='none';$('#app').style.display='flex';welcome(n)}
function logout(){token='';delete localStorage.ely_t;delete sessionStorage.ely_t;$('#app').style.display='none';$('#login').style.display='flex'}
$('#out').onclick=logout;$('#clear').onclick=()=>welcome(localStorage.ely_n);
$('#cf').onsubmit=async e=>{e.preventDefault();const q=$('#q').value.trim();if(!q)return;$('#q').value='';document.querySelector('.chips')?.remove();
 add(q,'u');hist.push({role:'user',content:q});const w=add('','a');w.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
 try{const r=await api('/api/chat',{messages:hist},true);w.textContent=r.reply;hist.push({role:'assistant',content:r.reply})}
 catch(x){w.textContent='⚠️ '+x.message;if(x.status===401)setTimeout(logout,1500)}$('#msgs').scrollTop=1e9};
if(token)openApp(localStorage.ely_n);
</script>
</body>
</html>
